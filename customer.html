<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Non-Blocking JS Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    button { padding: 10px 18px; margin-right: 10px; font-size: 15px; cursor: pointer; }
    .box { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; min-height: 40px; }
    #status { color: #d35400; font-weight: bold; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>JavaScript is Non-Blocking on the Client</h2>

  <button id="btnCustomers">Get Customers (5 sec)</button>
  <button id="btnClick">Click Me Anytime</button>

  <div class="box">
    <div id="status"></div>
    <div id="customers"></div>
  </div>

  <div class="box">
    <strong>Clicks while waiting:</strong> <span id="count">0</span>
    <ul id="log"></ul>
  </div>

  <script>
    const API_URL = "http://localhost:3000/api/customers";

    // Button 1: slow API call using fetch (async, does not block)
    document.getElementById("btnCustomers").addEventListener("click", () => {
      const status = document.getElementById("status");
      const output = document.getElementById("customers");
      status.textContent = "Loading....";
      output.innerHTML = "";

      fetch(API_URL)
        .then(response => response.json())
        .then(customers => {
          status.textContent = "Loaded " + customers.length + " customers";
          let html = "<table><tr><th>ID</th><th>Name</th><th>City</th></tr>";
          customers.forEach(c => {
            html += `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.city}</td></tr>`;
          });
          output.innerHTML = html + "</table>";
        })
        .catch(err => {
          status.textContent = "Error: " + err.message;
        });

      console.log("fetch() started - this line runs immediately, no waiting!");
    });

    // Button 2: responds instantly, even while the fetch is pending
    let count = 0;
    document.getElementById("btnClick").addEventListener("click", () => {
      count++;
      document.getElementById("count").textContent = count;
      const li = document.createElement("li");
      li.textContent = "Clicked at " + new Date().toLocaleTimeString();
      document.getElementById("log").appendChild(li);
    });
  </script>
</body>
</html>
